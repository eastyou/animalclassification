[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "animalclassification"
version = "0.1.0"
description = "动物分类：脊椎动物五类与无脊椎类群查询、判断与练习页"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "biology", "animals", "python", "teaching"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Education",
  "Topic :: Education",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
animalclassification = "animalclassification.cli:main"

[tool.setuptools]
packages = ["animalclassification"]
